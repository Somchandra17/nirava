name: build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v4
      - name: Install CI build dependencies
        run: dnf install -y cargo rust gcc pkgconf-pkg-config gtk4-devel libadwaita-devel pulseaudio-libs-devel python3 dbus-daemon
      - name: Build all native components
        run: cargo build --locked --workspace --features nirava-cli/audio,nirava-service/audio
      - name: Test disposable fixtures
        run: cargo test --locked --workspace --features nirava-cli/audio,nirava-service/audio
      - name: Test isolated D-Bus
        run: python3 tests/dbus_smoke.py
      - name: Validate packaging and non-mutating installer behavior
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 tests/packaging_test.py
          bash -n tools/install.sh
