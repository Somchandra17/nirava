[package]
name = "nirava-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "nirava"
path = "src/main.rs"

[dependencies]
nirava-core.workspace = true
nirava-backends = { path = "../nirava-backends", features = ["audio"] }
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
zbus.workspace = true
gtk = { package = "gtk4", version = "=0.11.5", features = ["v4_12"] }
adw = { package = "libadwaita", version = "=0.9.2", features = ["v1_6"] }
