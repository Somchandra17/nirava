[workspace]
resolver = "3"
members = ["crates/plain-core", "crates/plain-backends", "crates/plain-service", "crates/plain-ui", "crates/plain-cli"]
default-members = ["crates/plain-core", "crates/plain-backends", "crates/plain-service", "crates/plain-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"

[workspace.dependencies]
plain-core = { path = "crates/plain-core" }
plain-backends = { path = "crates/plain-backends" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "fs", "signal", "io-util"] }
zbus = { version = "5", default-features = false, features = ["tokio", "blocking-api"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = "debuginfo"
